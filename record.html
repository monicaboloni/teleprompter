<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teleprompter Recorder</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--btn:#2c2c2e;--on:#7cc4ff;--rec:#ff453a;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
#prompt{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:48%;overflow:hidden;
  background:rgba(0,0,0,.55);touch-action:none}
#text{position:absolute;left:0;right:0;top:0;padding:0 22px;font-weight:700;line-height:1.4;
  white-space:pre-wrap;word-wrap:break-word;will-change:transform;font-size:40px}
#line{position:absolute;left:0;right:0;height:2px;background:var(--on);opacity:.6}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;align-items:center;
  background:linear-gradient(transparent,rgba(0,0,0,.75) 40%)}
#tools{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:center}
#tools label{display:flex;align-items:center;gap:8px;font-size:15px}
#tools input[type=range]{width:110px}
button{font:inherit;font-size:17px;font-weight:700;color:var(--fg);background:var(--btn);border:0;border-radius:10px;
  min-height:44px;min-width:44px;padding:0 16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--on);outline-offset:2px}
#rec{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid #888;padding:0;position:relative}
#rec::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--rec);transition:all .15s}
#rec.on::after{inset:20px;border-radius:8px}
#msg{margin:0;color:#ff9f0a;font-size:15px;text-align:center;display:none}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:180px;font-weight:700;
  background:rgba(0,0,0,.35);z-index:3;pointer-events:none}
#timer{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 54%);display:none;background:var(--rec);
  border-radius:8px;padding:4px 10px;font-weight:700;font-size:16px}
.overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;z-index:5;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
#review video{flex:1;min-height:0;width:100%;object-fit:contain;background:#111;border-radius:10px}
#review .row{display:flex;gap:10px}
#review .row button{flex:1}
#share{background:var(--on);color:#000}
#editor textarea{flex:1;font:inherit;font-size:22px;line-height:1.5;background:#111;color:var(--fg);
  border:1px solid #333;border-radius:10px;padding:16px;-webkit-user-select:text;user-select:text}
.overlay p{margin:0;font-size:16px;opacity:.75}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="prompt"><div id="text"></div><div id="line"></div></div>
<div id="count"></div>
<div id="timer">REC 0:00</div>

<div id="bottom">
  <p id="msg"></p>
  <div id="tools">
    <label>Speed <input id="speed" type="range" min="10" max="160" value="40"></label>
    <label>Size <input id="size" type="range" min="24" max="80" value="40"></label>
    <button id="flip">Flip camera</button>
    <button id="edit">Edit script</button>
  </div>
  <button id="rec" aria-label="Start recording"></button>
</div>

<div id="review" class="overlay">
  <p>Review your take. Tap Save or share, then choose Save Video.</p>
  <video id="playback" controls playsinline></video>
  <div class="row"><button id="retake">Retake</button><button id="share">Save or share</button></div>
</div>

<div id="editor" class="overlay">
  <p>Paste or type your script, then tap Done.</p>
  <textarea id="script" spellcheck="false"></textarea>
  <button id="done">Done</button>
</div>

<script>
(function(){
  var DEFAULT="Welcome to the recorder. Tap Edit script to paste your own text.\n\nTap the big button to start. You get a three second countdown, then the video records and the text scrolls.\n\nTap the text to pause or resume scrolling. Tap the button again to stop.";
  var $=function(id){return document.getElementById(id)};
  var cam=$('cam'), textEl=$('text'), prompt_=$('prompt'), line=$('line');
  var facing='user', stream=null, recorder=null, chunks=[], recording=false, mime='';
  var scrolling=false, offset=0, speed=40, blob=null, fileName='', wake=null, t0=0, tick=null, counting=false;

  function load(){try{return localStorage.getItem('tp_script')}catch(e){return null}}
  function save(s){try{localStorage.setItem('tp_script',s)}catch(e){}}
  var script=load()||DEFAULT;

  function msg(t){$('msg').textContent=t||'';$('msg').style.display=t?'block':'none'}
  function readLine(){return prompt_.clientHeight*0.2}
  function place(){textEl.style.transform='translate3d(0,'+(readLine()-offset)+'px,0)'}
  function setSize(px){textEl.style.fontSize=px+'px';line.style.top=(readLine()+px*0.72)+'px'}
  function render(){textEl.textContent=script;offset=0;setSize(+$('size').value);place()}

  // ---- camera ----
  function startCam(){
    if(stream){stream.getTracks().forEach(function(t){t.stop()})}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      msg('Camera is not available here. Open this page in Safari over https.');return Promise.resolve(false)}
    return navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920},aspectRatio:{ideal:9/16},frameRate:{ideal:30}},
      audio:{echoCancellation:true,noiseSuppression:true}
    }).then(function(s){
      stream=s;cam.srcObject=s;cam.classList.toggle('mirror',facing==='user');msg('');return true;
    }).catch(function(){
      msg('Camera or microphone access was blocked. Allow both in Safari settings, then reload.');return false;
    });
  }

  // ---- recording ----
  function pickMime(){
    var list=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];
    for(var i=0;i<list.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(list[i]))return list[i]}
    return '';
  }
  function fmt(s){return Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2)}
  function begin(){
    if(!window.MediaRecorder){msg('Recording is not supported in this browser. Use Safari on iOS 14.3 or newer.');return}
    mime=pickMime();chunks=[];
    try{recorder=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{})}
    catch(e){msg("Couldn't start recording.");return}
    recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=finish;
    recorder.start(1000);
    recording=true;$('rec').classList.add('on');$('tools').style.display='none';
    $('timer').style.display='block';t0=Date.now();
    tick=setInterval(function(){$('timer').textContent='REC '+fmt((Date.now()-t0)/1000)},500);
    offset=0;place();scrolling=true;
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}
  }
  function stop(){
    if(!recording)return;
    recording=false;scrolling=false;clearInterval(tick);
    $('rec').classList.remove('on');$('timer').style.display='none';$('tools').style.display='flex';
    try{recorder.stop()}catch(e){}
    try{wake&&wake.release();wake=null}catch(e){}
  }
  function finish(){
    var type=(recorder&&recorder.mimeType)||mime||'video/mp4';
    var ext=type.indexOf('mp4')>-1?'mp4':'webm';
    blob=new Blob(chunks,{type:type.split(';')[0]});
    fileName='tiktok-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ext;
    $('playback').src=URL.createObjectURL(blob);
    $('review').style.display='flex';
  }
  function countdown(){
    if(counting||recording)return;
    counting=true;var n=3,c=$('count');c.style.display='flex';c.textContent=n;
    var iv=setInterval(function(){
      n--;
      if(n>0){c.textContent=n}
      else{clearInterval(iv);c.style.display='none';counting=false;begin()}
    },1000);
  }
  $('rec').onclick=function(){
    if(recording)stop();
    else if(!counting){ if(stream)countdown(); else startCam().then(function(ok){if(ok)countdown()}) }
  };

  // ---- review ----
  $('retake').onclick=function(){
    $('review').style.display='none';$('playback').removeAttribute('src');blob=null;offset=0;place();
  };
  $('share').onclick=function(){
    if(!blob)return;
    var f;try{f=new File([blob],fileName,{type:blob.type})}catch(e){f=null}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).catch(function(){});
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;
      document.body.appendChild(a);a.click();a.remove();
    }
  };

  // ---- scrolling ----
  var prevT=performance.now();
  function frame(t){
    var dt=Math.min(0.1,(t-prevT)/1000);prevT=t;
    if(scrolling){
      offset+=speed*dt;var max=textEl.offsetHeight;
      if(offset>=max){offset=max;scrolling=false}
      place();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var down=false,startY=0,lastY=0,moved=false;
  prompt_.addEventListener('pointerdown',function(e){down=true;moved=false;startY=lastY=e.clientY;prompt_.setPointerCapture(e.pointerId)});
  prompt_.addEventListener('pointermove',function(e){
    if(!down)return;
    if(Math.abs(e.clientY-startY)>6)moved=true;
    if(!moved)return;
    offset=Math.min(Math.max(0,offset-(e.clientY-lastY)),textEl.offsetHeight);lastY=e.clientY;place();
  });
  prompt_.addEventListener('pointerup',function(){if(down&&!moved)scrolling=!scrolling;down=false});
  prompt_.addEventListener('pointercancel',function(){down=false});

  // ---- controls ----
  $('speed').oninput=function(e){speed=+e.target.value};
  $('size').oninput=function(e){setSize(+e.target.value);place()};
  $('flip').onclick=function(){facing=facing==='user'?'environment':'user';startCam()};
  $('edit').onclick=function(){scrolling=false;$('script').value=script;$('editor').style.display='flex'};
  $('done').onclick=function(){
    script=$('script').value.trim()||DEFAULT;save(script);$('editor').style.display='none';render();
  };
  window.addEventListener('resize',function(){setSize(+$('size').value);place()});

  render();startCam();
})();
</script>
</body>
</html>
