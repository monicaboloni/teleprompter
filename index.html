<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teleprompter</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --dim:rgba(255,255,255,.32); --bar:#1c1c1e; --btn:#2c2c2e; --on:#7cc4ff; --onfg:#000;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#flip{position:absolute;inset:0}
#text{position:absolute;left:0;right:0;top:0;padding:0 64px;font-weight:700;line-height:1.45;
  white-space:pre-wrap;word-wrap:break-word;will-change:transform}
#text .done{color:var(--dim)}
#mark{position:absolute;left:14px;width:0;height:0;border-left:22px solid var(--on);
  border-top:14px solid transparent;border-bottom:14px solid transparent}
#bar{background:var(--bar);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
#bar label{display:flex;align-items:center;gap:8px;font-size:16px}
#bar input[type=range]{width:150px}
button{font:inherit;font-size:17px;font-weight:700;color:var(--fg);background:var(--btn);border:0;border-radius:10px;
  min-height:44px;min-width:44px;padding:0 16px}
button.on{background:var(--on);color:var(--onfg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--on);outline-offset:2px}
#play{min-width:96px}
.seg{display:flex;gap:2px}
.seg button:first-child{border-radius:10px 0 0 10px}
.seg button:last-child{border-radius:0 10px 10px 0}
#msg{width:100%;text-align:center;color:#ff9f0a;font-size:15px;margin:0;display:none}
#editor{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;padding:20px;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:5}
#editor textarea{flex:1;font:inherit;font-size:22px;line-height:1.5;background:#111;color:var(--fg);
  border:1px solid #333;border-radius:10px;padding:16px;-webkit-user-select:text;user-select:text}
#editor p{margin:0;font-size:16px;opacity:.7}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="flip"><div id="text"></div><div id="mark"></div></div>
  </div>
  <div id="bar">
    <p id="msg"></p>
    <button id="play">Play</button>
    <button id="restart">Restart</button>
    <div class="seg" role="group" aria-label="Scroll mode">
      <button id="m-auto" class="on">Auto scroll</button>
      <button id="m-voice">Voice follow</button>
    </div>
    <label id="speedWrap">Speed <input id="speed" type="range" min="10" max="200" value="45"></label>
    <label>Size <input id="size" type="range" min="36" max="140" value="72"></label>
    <button id="mirror">Mirror</button>
    <button id="edit">Edit script</button>
  </div>
</div>

<div id="editor">
  <p>Paste or type your script, then tap Done.</p>
  <textarea id="script" spellcheck="false"></textarea>
  <button id="done">Done</button>
</div>

<script>
(function(){
  var DEFAULT = "Welcome to your teleprompter. Tap Edit script to paste in your own text.\n\nChoose Auto scroll to have the text move at a steady speed, or Voice follow to have it keep pace with you as you read out loud.\n\nTap the text to play or pause. Drag to move to a different spot.";
  var $ = function(id){return document.getElementById(id)};
  var stage=$('stage'), textEl=$('text'), mark=$('mark'), msgEl=$('msg');
  var mode='auto', running=false, offset=0, wordIndex=0, marked=0, lastKey='';
  var speed=45, words=[], rec=null, wake=null;

  function load(){ try{ return localStorage.getItem('tp_script') }catch(e){ return null } }
  function save(s){ try{ localStorage.setItem('tp_script', s) }catch(e){} }
  var script = load() || DEFAULT;

  function norm(s){ return s.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'') }
  function msg(t){ msgEl.textContent=t||''; msgEl.style.display=t?'block':'none' }

  function render(){
    textEl.textContent=''; words=[];
    var re=/(\s+)|(\S+)/g, m;
    while((m=re.exec(script))){
      if(m[1]){ textEl.appendChild(document.createTextNode(m[1])); continue; }
      var sp=document.createElement('span'); sp.textContent=m[2];
      textEl.appendChild(sp);
      var n=norm(m[2]); if(n) words.push({el:sp,n:n});
    }
    wordIndex=0; marked=0; lastKey=''; offset=0; place();
  }
  function readLine(){ return stage.clientHeight*0.35 }
  function setSize(px){
    textEl.style.fontSize=px+'px';
    mark.style.top=(readLine()+px*0.72-14)+'px';
  }
  function place(){ textEl.style.transform='translate3d(0,'+(readLine()-offset)+'px,0)' }
  function maxOffset(){ return textEl.offsetHeight }

  function markDone(){
    var i;
    if(wordIndex>marked){ for(i=marked;i<wordIndex;i++) words[i].el.classList.add('done'); }
    else { for(i=wordIndex;i<marked;i++) words[i].el.classList.remove('done'); }
    marked=wordIndex;
  }

  // ---- voice ----
  function handle(spoken){
    if(mode!=='voice'||!running) return;
    var s=spoken.map(norm).filter(Boolean); if(!s.length) return;
    var last=s[s.length-1], prev=s.length>1?s[s.length-2]:'';
    var key=s.length+'|'+prev+'|'+last; if(key===lastKey) return; lastKey=key;
    var upper=Math.min(wordIndex+12, words.length);
    for(var j=wordIndex;j<upper;j++){
      if(words[j].n===last){
        var pair=j>0&&prev&&words[j-1].n===prev;
        if(pair||last.length>3){ wordIndex=j+1; markDone(); break; }
      }
    }
  }
  function startVoice(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ msg("Voice follow isn't supported in this browser. Open this page in Safari on your iPad."); return false; }
    rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
    rec.onresult=function(e){
      var t=[]; for(var i=0;i<e.results.length;i++) t.push(e.results[i][0].transcript);
      handle(t.join(' ').split(/\s+/));
    };
    rec.onend=function(){ if(running&&mode==='voice'){ try{ rec.start() }catch(e){} } };
    rec.onerror=function(e){
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        msg('Microphone or speech access is blocked. Allow it in Safari settings, then try again.'); pause();
      }
    };
    try{ rec.start(); return true }catch(e){ msg("Couldn't start listening."); return false }
  }
  function stopVoice(){ if(rec){ var r=rec; rec=null; r.onend=null; try{ r.stop() }catch(e){} } }

  // ---- transport ----
  function play(){
    msg('');
    if(mode==='voice' && !startVoice()) return;
    running=true; $('play').textContent='Pause'; $('play').classList.add('on');
    try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){}) }catch(e){}
  }
  function pause(){
    running=false; stopVoice(); $('play').textContent='Play'; $('play').classList.remove('on');
    try{ wake&&wake.release(); wake=null }catch(e){}
  }
  function toggle(){ running?pause():play() }
  function restart(){ pause(); offset=0; wordIndex=0; markDone(); lastKey=''; place() }

  var prevT=performance.now();
  function frame(t){
    var dt=Math.min(0.1,(t-prevT)/1000); prevT=t;
    if(running){
      var max=maxOffset();
      if(mode==='auto') offset+=speed*dt;
      else {
        var w=words[wordIndex], target=w?w.el.offsetTop:max;
        offset+=(target-offset)*Math.min(1,dt*4);
      }
      if(offset>=max){ offset=max; if(mode==='auto') pause(); }
      place();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- drag / tap ----
  var down=false, startY=0, lastY=0, moved=false;
  stage.addEventListener('pointerdown',function(e){ down=true; moved=false; startY=lastY=e.clientY; stage.setPointerCapture(e.pointerId) });
  stage.addEventListener('pointermove',function(e){
    if(!down) return;
    if(Math.abs(e.clientY-startY)>6) moved=true;
    if(!moved) return;
    offset=Math.min(Math.max(0,offset-(e.clientY-lastY)),maxOffset()); lastY=e.clientY;
    if(mode==='voice'){
      var i=0; while(i<words.length&&words[i].el.offsetTop<offset) i++;
      wordIndex=i; markDone();
    }
    place();
  });
  function up(){ if(down&&!moved) toggle(); down=false }
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',function(){ down=false });

  // ---- controls ----
  function setMode(m){
    mode=m; pause(); restart();
    $('m-auto').classList.toggle('on',m==='auto'); $('m-voice').classList.toggle('on',m==='voice');
    $('speedWrap').style.display=m==='auto'?'flex':'none';
    if(m==='auto'){ for(var i=0;i<words.length;i++) words[i].el.classList.remove('done'); }
  }
  $('play').onclick=toggle; $('restart').onclick=restart;
  $('m-auto').onclick=function(){setMode('auto')}; $('m-voice').onclick=function(){setMode('voice')};
  $('speed').oninput=function(e){ speed=+e.target.value };
  $('size').oninput=function(e){ setSize(+e.target.value); place() };
  $('mirror').onclick=function(){
    var on=this.classList.toggle('on'); $('flip').style.transform=on?'scaleX(-1)':'';
  };
  $('edit').onclick=function(){ pause(); $('script').value=script; $('editor').style.display='flex' };
  $('done').onclick=function(){
    script=$('script').value.trim()||DEFAULT; save(script);
    $('editor').style.display='none'; render();
  };
  window.addEventListener('resize',function(){ setSize(+$('size').value); place() });

  setSize(72); render(); setMode('auto');
})();
</script>
</body>
</html>
